[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermeshield"
version = "0.1.0"
description = "Autonomous AI security auditing and red-team simulation platform"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
hermes-shield = "hermes_shield.agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_paths = ["hermes_shield"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]